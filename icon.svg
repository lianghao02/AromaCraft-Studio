<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#284439"/>
      <stop offset="100%" stop-color="#192c24"/>
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a4d792"/>
      <stop offset="100%" stop-color="#488653"/>
    </linearGradient>
    <linearGradient id="dropGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8df97"/>
      <stop offset="100%" stop-color="#d49b29"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- 背景圓角方塊 -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  
  <g filter="url(#shadow)">
    <!-- 葉片 1 (左) -->
    <path d="M 256 370 C 170 370 120 280 140 190 C 190 200 250 260 256 370 Z" fill="url(#leafGrad)" opacity="0.9"/>
    
    <!-- 葉片 2 (右主葉) -->
    <path d="M 256 390 C 370 360 410 240 360 140 C 270 170 240 280 256 390 Z" fill="url(#leafGrad)"/>
    
    <!-- 葉脈光澤 -->
    <path d="M 256 390 Q 280 270 360 140" stroke="#cbf3bc" stroke-width="6" stroke-linecap="round" fill="none" opacity="0.6"/>

    <!-- 精油金露水滴 (中央核心) -->
    <path d="M 256 180 C 220 230 200 270 200 310 C 200 345 225 370 256 370 C 287 370 312 345 312 310 C 312 270 292 230 256 180 Z" fill="url(#dropGrad)"/>
    
    <!-- 水滴高光反光 -->
    <ellipse cx="238" cy="290" rx="14" ry="24" transform="rotate(-25 238 290)" fill="#ffffff" opacity="0.55"/>
  </g>
</svg>
