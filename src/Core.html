<script>
/* 前後端共用純計算：統一 g／mL 或分開計量，價格為新臺幣。 */
var AromaCore = (() => {
  'use strict';
  const TYPES = ['融製精油皂', '無水精油膏', '按摩油', '日常清潔液', '水垢清潔'];
  function number(v, label, min = 0, max = 1e12) {

  }
  function text(v, label, max = 500, required = true) {

  }
  const BASIS=['g','mL'];
  const empty=v=>v===''||v===null||v===undefined;

  }
  function convert(value,from,to,p={},target=null,basis='g') {

  }
  function convertInput(value,from,to,p,recipe){

  }
  function price(p,basis='g') {

  }
  function basisOf(recipe){const unit=empty(recipe.quantityUnit)?'g':recipe.quantityUnit;if(![...BASIS,'mixed'].includes(unit))throw Error('總量基準必須是 g 或 mL');return unit;}
  function itemPrice(i,prices){const p=prices.find(p=>p.id===i.priceId&&p.materialId===i.materialId);if(!p)throw Error('原料尚未設定價格');return empty(i.dropsPerMl)?p:{...p,dropsPerMl:number(i.dropsPerMl,'每 mL 滴數',Number.MIN_VALUE,1e6)};}
  const nativeBasis=p=>p.unit==='mL'?'mL':'g';
  function targetOf(recipe){return empty(recipe.targetQuantity)?null:number(recipe.targetQuantity,'固定總量',Number.MIN_VALUE,1e9);}
  function itemAmount(item,recipe,prices){if(item.unit&&item.grams!==undefined)throw Error('同一原料只能提供一種用量，不能同時填 grams 與 quantity');const p=itemPrice(item,prices),basis=basisOf(recipe)==='mixed'?nativeBasis(p):basisOf(recipe);if(basisOf(recipe)==='mixed'&&(item.unit==='%'||targetOf(recipe)!==null||recipe.baseId))throw Error('分開計量不計濃度；請先選 g 或 mL 總量再用 %');return convert(item.unit?item.quantity:item.grams,item.unit||'g',basis,p,targetOf(recipe),basis);}
  function releaseTarget(recipe,prices){return {...recipe,targetQuantity:null,baseId:'',items:recipe.items.map(i=>i.unit==='%'?({materialId:i.materialId,priceId:i.priceId,unit:basisOf(recipe),quantity:itemAmount(i,recipe,prices)}):({...i}))};}
  function totalTolerance(n){return Math.max(Number.MIN_VALUE*8,Math.abs(n)*Number.EPSILON*32);}
  function sameTotal(a,b){return Math.abs(a-b)<=totalTolerance(b);}

    const base=next.items.find(i=>i.materialId===next.baseId);if(!base)throw Error('補足原料不在配方內');

  }
  function editQuantityUnchecked(recipe,id,value,unit,materials,prices){
    const next={...recipe,items:recipe.items.map(i=>({...i}))};const item=next.items.find(i=>i.materialId===id);if(!item)throw Error('找不到原料');
    item.quantity=number(value,'原料用量',0,1e9);item.unit=unit;delete item.grams;itemAmount(item,next,prices);

  }
  function editQuantity(recipe,id,value,unit,materials,prices){const next=editQuantityUnchecked(recipe,id,value,unit,materials,prices);validateConcentration(next,materials,prices,false);return next;}
  function scaleRecipe(recipe,total,materials,prices){
    if(basisOf(recipe)==='mixed')throw Error('分開計量不能依共同總量縮放，請分別調整用量');
    const target=number(total,'新總量',Number.MIN_VALUE,1e9),old=recipe.items.reduce((s,i)=>s+itemAmount(i,recipe,prices),0);if(old<=0)throw Error('請先設定原料用量');
    const amounts=recipe.items.map(i=>itemAmount(i,recipe,prices));const next={...recipe,targetQuantity:target,items:recipe.items.map((i,n)=>({...i,unit:basisOf(recipe),quantity:amounts[n]*target/old}))};next.items.forEach(i=>delete i.grams);return balance(next,materials,prices);
  }
  // 濃度使用精油體積／成品體積；目標上限由使用者指定，不代表安全建議。
  function concentration(recipe,materials,prices,selectedId){
    const cfg=recipe.concentration||{},limit=empty(cfg.maxPercent)?null:number(cfg.maxPercent,'目標濃度上限',0,100);
    const declared=empty(cfg.totalMl)?null:number(cfg.totalMl,'成品總容量',Number.MIN_VALUE,1e9);
    let oilMl=0,allMl=0,allKnown=true,oilKnown=true,problem='',selectedMl=0;
    for(const i of recipe.items||[]){
      const oil=materials.find(m=>m.id===i.materialId)?.category==='精油';
      try{const p=itemPrice(i,prices),value=i.unit?i.quantity:i.grams,u=i.unit||'g';
        const ml=number(value,'原料用量')===0?0:convert(value,u,'mL',p,targetOf(recipe),basisOf(recipe)==='mixed'?nativeBasis(p):basisOf(recipe));

      }catch(e){allKnown=false;if(oil){oilKnown=false;problem='請完成精油用量及滴數換算；以 g 輸入且無體積資料時，無法估算體積濃度。';}}
    }
    const totalMl=declared??(allKnown&&allMl>0?allMl:null),available=oilKnown&&totalMl!==null;
    const percent=available?oilMl/totalMl*100:null;
    const mismatch=declared!==null&&allKnown&&!sameTotal(allMl,declared);
    const over=available&&limit!==null&&oilMl>totalMl*limit/100&&!sameTotal(oilMl,totalMl*limit/100);
    let message=problem||(!totalMl?'請填成品總容量（包含精油），才能估算濃度。':over?'已超過你設定的目標濃度，請減少精油用量。':mismatch?'材料合計與成品總容量不同，請確認完成後的總容量。':limit!==null?'未超過你設定的目標；不代表適合兒童。':'尚未設定濃度上限。');

    const selected=(recipe.items||[]).find(i=>i.materialId===selectedId);
    if(available&&limit!==null&&declared!==null&&selected){const factor=metadata(itemPrice(selected,prices)).dropsPerMl;if(factor!==null){const floor=n=>Math.floor(Math.max(0,n)+totalTolerance(n));maxDrops=floor((declared*limit/100-(oilMl-selectedMl))*factor);remainingDrops=floor((declared*limit/100-oilMl)*factor);}}

  }
  function validateConcentration(recipe,materials,prices,complete=true){
    const r=concentration(recipe,materials,prices);
    if(r.maxPercent!==null&&r.declaredMl===null)throw Error('設定濃度上限時，請填成品總容量（包含精油）。');
    if(r.maxPercent!==null&&!r.available)throw Error(r.message);
    if(r.overLimit)throw Error(r.message);
    if(complete&&r.totalMismatch)throw Error(r.message);

  }
  function settings(s) {
    return {
      packaging: number(s.packaging, '每件包材成本'), minutes: number(s.minutes, '批次工時分鐘'),
      hourly: number(s.hourly, '時薪'), other: number(s.other, '批次其他成本'),
      loss: number(s.loss, '耗損率', 0, 99.99), margin: number(s.margin, '目標毛利率', 0, 99.99),

    };
  }
  function calculate(recipe, materials, prices, rules) {
    if (!TYPES.includes(recipe.type)) throw Error('不支援的作品類型');

    if (!Number.isInteger(units)) throw Error('合格成品數量必須為整數');

      seen.add(i.materialId);
      const m = materials.find(m => m.id === i.materialId);
      if (!m) throw Error('原料已不存在，請重新選擇');

      const amount = itemAmount(i,recipe,prices);
      if (!p) throw Error(m.name + '缺少有效採購批次價格');

      const actual = price(p,itemBasis);

        priceLabel:p.label,quantity:i.unit?number(i.quantity,'原料用量'):number(i.grams,'原料重量'),unit:i.unit||'g',amount,amountUnit:itemBasis,density:actual.density,dropsPerMl:actual.dropsPerMl,perUnit:actual.perUnit,perGram:actual.perGram,grams:itemBasis==='g'?amount:null,cost:amount*actual.perUnit };
    });

    const packaging = s.packaging * units;
    const labor = s.minutes / 60 * s.hourly;
    const batch = material + lossCost + packaging + labor + s.other;
    const perUnit = batch / units;

    const grossMargin = s.sale === null || s.sale === 0 ? null : (s.sale - perUnit) / s.sale * 100;

    if(basis==='mixed')messages.push('g 與 mL 分開計量，分別估材料費；精油體積濃度另外計算，不套用重量安全限制比例。');

      if((r.basis||'g')!==basis){messages.push('待驗證：安全規則比例基準不符，不能混用重量與體積百分比');continue;}

    }

      other: s.other, batch, perUnit, suggested, grossMargin, oilPercent, concentration:concentration(recipe,materials,prices), safety: exceeded ? '超出限制' : '待驗證', messages };
  }
  function adjust(items, materialId, grams, baseId) {
    const next = items.map(i => ({ ...i }));

</script>
