<script>
(() => {
  'use strict';
  const $ = id => document.getElementById(id);
  const money = n => 'NT$' + new Intl.NumberFormat('zh-TW', { minimumFractionDigits: 2, maximumFractionDigits: 2 }).format(n);
  const fmt = n => Number(n).toLocaleString('zh-TW', { maximumFractionDigits: 4 });
  const escape = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
  const uid = () => crypto.randomUUID ? crypto.randomUUID() : Date.now() + '-' + Math.random().toString(36).slice(2);
  const draftStorage = window.AROMA_DEMO ? sessionStorage : localStorage;

  function confirmChange(title, target, action) {
    if ($('confirmDialog').open) return Promise.resolve(false);
    return new Promise(resolve=>{
      $('confirmTitle').textContent=title;
      $('confirmMessage').textContent=target;
      $('confirmKeep').textContent=action==='放棄並切換'||action==='放棄並載入'?'繼續編輯':'取消';
      $('confirmProceed').textContent=action;
      const finish=value=>{ $('confirmDialog').close();resolve(value); };
      $('confirmKeep').onclick=()=>finish(false);
      $('confirmProceed').onclick=()=>finish(true);
      $('confirmDialog').oncancel=e=>{e.preventDefault();finish(false);};
      $('confirmDialog').showModal();$('confirmKeep').focus();
    });
  }
  const materialPageSize=()=>window.innerWidth<768?8:24;
  let materialLimit=materialPageSize(),validationError='';
  let data, recipe, category = '全部', oilKind = '全部', busy = false, dirty = false, editorAction, pendingSave, pendingLog, draftKey, noticeTimer = null;
  let productionSource=null;
  window.AromaDraftPending=()=>dirty;window.addEventListener('aroma-cloud-update',()=>{if(!busy&&!dirty)refresh().catch(fail);});
  const blank = type => ({ id: '', version: 0, policyVersion:2,planning:{mode:'free',sizing:'batch',total:30,percent:1,basis:AromaCore.productBasis(type),baseId:'',packagingId:''},name: type + '新配方', type, quantityUnit:'mixed',targetQuantity:null, concentration:{auto:true,useDefaultDrops:true,basis:AromaCore.productBasis(type),limitBasis:AromaCore.productBasis(type)}, units: 1, notes: '', baseId: '', items: [], cost: { ...data.cost, minutes:0, hourly:0, other:0, loss:0, margin:0, sale:null } });

  function notice(message, isError = false) {
    if (noticeTimer && typeof clearTimeout === 'function') { clearTimeout(noticeTimer); noticeTimer = null; }
    const el = $('notice'), msgEl = $('noticeMsg');
    if (!message) {
      el.hidden = true;
      if (msgEl) msgEl.textContent = '';
      else el.textContent = '';
      return;
    }
    if (msgEl) msgEl.textContent = message;
    else el.textContent = message;
    el.className = isError ? 'alert-error' : '';
    el.hidden = false;
    if (!isError && message !== '正在處理，請稍候…' && typeof setTimeout === 'function') {
      noticeTimer = setTimeout(() => { notice(''); }, 3500);
    }
  }

  function fail(e) {
    const message = e.message || String(e);
    if ($('editor').open) {
      $('editorError').textContent = message;
      $('editorError').hidden = false;
    } else {
      notice(message, true);
    }
  }

  let recipePickerOpen=false, quantityQueue=[], quantityPosition=0, quantityMode=false;
  const pendingQuantities=new Set(), removedSelections=new Map();
  function switchTab(target) {
    const picker=$('materialPicker'), owner=$(target==='tabManage'?'manageMaterialSlot':'viewRecipe');
    const fromManage=picker?.dataset?.manage==='true';
    if(target==='tabManage'&&!fromManage)recipePickerOpen=picker.open;
    if(target==='tabRecipe'&&fromManage)picker.open=recipePickerOpen;
    if(picker&&target!=='tabSaved'){if(target==='tabRecipe'&&owner?.insertBefore&&$('recipeWorkspace'))owner.insertBefore(picker,$('recipeWorkspace'));else if(owner?.append)owner.append(picker);}
    if(target!=='tabSaved'){
      if(picker?.dataset)picker.dataset.manage=String(target==='tabManage');
      if(target==='tabManage'){picker.open=true;switchManage('manageBasics');}
      if($('materialPickerTitle'))$('materialPickerTitle').textContent=target==='tabManage'?'原料與價格':'2 選原料與調整用量';
      if($('materialPickerHint'))$('materialPickerHint').textContent=target==='tabManage'?'點卡片編輯名稱、容量與價格':'可多選，選好後集中填用量';
    }
    const tabMap = [
      ['tabRecipe', 'viewRecipe'],
      ['tabSaved', 'viewSaved'],
      ['tabManage', 'viewManage']
    ];
    tabMap.forEach(([btnId, viewId]) => {
      const btn = $(btnId), view = $(viewId);
      if (!btn || !view) return;
      const active = btnId === target;
      btn.className = active ? 'tab-btn active' : 'tab-btn';
      if (btn.setAttribute) {btn.setAttribute('aria-selected', String(active));btn.setAttribute('tabindex',active?'0':'-1');}
      view.hidden = !active;
    });
    const summaryEl = $('summaryBar');
    if (summaryEl) summaryEl.hidden = (target !== 'tabRecipe');
    if(data&&target!=='tabSaved'){renderMaterials();renderSelected();updateState();}
    if(window.innerWidth<768&&window.scrollTo)window.scrollTo({top:0,behavior:'instant'});
  }

  function switchManage(target){
    [['manageBasics','manageBasicsBtn'],['manageRecords','manageRecordsBtn'],['manageData','manageDataBtn']].forEach(([id,btn])=>{
      $(id).hidden=id!==target;$(btn).setAttribute('aria-pressed',String(id===target));
    });
  }
  if($('manageBasicsBtn'))$('manageBasicsBtn').onclick=()=>switchManage('manageBasics');
  if($('manageRecordsBtn'))$('manageRecordsBtn').onclick=()=>switchManage('manageRecords');
  if($('manageDataBtn'))$('manageDataBtn').onclick=()=>switchManage('manageData');
  if($('manageCatalogSlot')?.append&&$('ylCatalog'))$('manageCatalogSlot').append($('ylCatalog'));
  // 三步驟進度：三個面板的 open 狀態是唯一來源，這裡只負責「同一時間只留一個」與進度顯示。
  const STEP_COPY=[['你要做什麼？','選一個類別，會直接進入下一步；換類別時，已選的原料與用量會保留。'],['加入原料與用量','點原料加入，填好用量後按下一步。'],['確認並儲存','核對成本與份數，確認後儲存。']];
  let lastStep=1;
  function stepPanels(){return [$('workPanel'),$('materialPicker'),$('recipePanel')];}
  function stepperSync(opened){
    const view=$('viewRecipe');if(!view)return;
    const panels=stepPanels(),inManage=!!panels[1]?.dataset&&panels[1].dataset.manage==='true';
    if(opened&&opened.open)panels.forEach((p,i)=>{if(p!==opened&&p.open&&!(i===1&&inManage))p.open=false;});
    let step=panels[2].open?3:(panels[1].open&&!inManage)?2:panels[0].open?1:lastStep;
    // 全部收起時畫面會空白；等同一輪的開合更新結束後，再補開目前步驟
    if(!inManage)setTimeout(()=>{if(!panels[0].open&&!panels[1].open&&!panels[2].open)panels[lastStep-1].open=true;},0);
    lastStep=step;
    if(view.dataset)view.dataset.step=String(step);else if(view.setAttribute)view.setAttribute('data-step',String(step));
    const ready=!!recipe&&recipe.items.length>0&&pendingQuantities.size===0;
    for(let n=1;n<=3;n++){
      const b=$('stepBtn'+n);if(!b)continue;
      b.disabled=n===3&&!ready;
      if(b.setAttribute)b.setAttribute('aria-current',n===step?'step':'false');
      if(b.dataset)b.dataset.state=n===step?'active':n<step?'done':'todo';
    }
    if($('stepTitle'))$('stepTitle').textContent=STEP_COPY[step-1][0];
    if($('stepHint'))$('stepHint').textContent=STEP_COPY[step-1][1];
  }
  stepPanels().forEach(p=>{if(p&&p.addEventListener)p.addEventListener('toggle',()=>stepperSync(p));});
  [1,2,3].forEach(n=>{const b=$('stepBtn'+n);if(b)b.onclick=()=>{const p=stepPanels()[n-1];if(!p||b.disabled)return;p.open=true;stepperSync(p);if(window.scrollTo)window.scrollTo({top:0,behavior:'instant'});};});
  let currentWorkMode = 'formulate';
  function switchWorkMode(mode) {
    currentWorkMode = mode;
    const view = $('viewRecipe');
    if (view) {
      if (view.dataset) view.dataset.mode = 'share';
      else if (view.setAttribute) view.setAttribute('data-mode', 'share');
    }
    const isFormulate = mode === 'formulate';
    if ($('modeFormulate')) {
      $('modeFormulate').className = isFormulate ? 'mode-btn active' : 'mode-btn';
      if ($('modeFormulate').setAttribute) $('modeFormulate').setAttribute('aria-selected', String(isFormulate));
    }
    if ($('modeCost')) {
      $('modeCost').className = !isFormulate ? 'mode-btn active' : 'mode-btn';
      if ($('modeCost').setAttribute) $('modeCost').setAttribute('aria-selected', String(!isFormulate));
    }
    if (mode === 'cost') {
      switchTab('tabRecipe');
      $('recipePanel').open=true;
      if ($('costPanel')) $('costPanel').open = true;
      if ($('costPanel')?.scrollIntoView) $('costPanel').scrollIntoView({ behavior: 'smooth', block: 'start' });
    } else {
      if ($('materialPicker')) $('materialPicker').open = true;
      focusRecipe();
    }
  }

  function updateState() {
    if (!recipe) return;
    if(data){if($('migrateUnits'))$('migrateUnits').hidden=!data.admin;if($('importCatalog')){$('importCatalog').hidden=!data.admin;$('importCatalog').disabled=busy||!data.unitSchema;}}
    const empty = !recipe.items.length;
    $('recordProduction').textContent=productionSource?'完成製作':'開始製作';$('productionBanner').hidden=!productionSource;
    $('recordProduction').disabled=busy||empty||pendingQuantities.size>0||!!validationError;
    $('name').readOnly=!!productionSource;$('saveAsNew').disabled=busy||!!productionSource;
    if($('saveHint'))$('saveHint').textContent=productionSource?'':recipe.id?'「更新配方」會取代目前保存的內容；想保留原本的做法，請按「另存新配方」。':empty?'':'儲存後會出現在「配方庫」，之後可更新或另存。';
    if($('saveAsNew'))$('saveAsNew').hidden=!recipe.id;
    if($('recipeTypeSelect')){$('recipeTypeSelect').value=AromaCore.categoryOf(recipe.type);$('recipeTypeSelect').disabled=!!recipe.id||!!productionSource;$('recipeTypeSelect').title=recipe.id?'已儲存的配方不能改類型；要換類型請另存新配方':'';}
    $('draftState').textContent = productionSource?'實際製作中':empty ? '未加入原料' : dirty ? '尚有未儲存變更' : recipe.id ? '已儲存' : '尚未儲存';
    const saveTxt = busy ? '處理中…' : recipe.id ? '更新配方' : '儲存配方';
    if(pendingQuantities.size){$('concentrationValue').textContent='尚有 '+pendingQuantities.size+' 項用量待填';$('concentrationMessage').textContent='請返回第 2 步完成用量後再確認濃度。';$('panelCost').textContent='—';$('summaryCost').textContent='—';$('panelWeight').textContent='用量尚未完整，暫不顯示總成本。';}
    const saveDis = !!productionSource || busy || !data || empty || pendingQuantities.size>0 || !!validationError || (!!recipe.id && !dirty);
    $('quickSave').textContent = saveTxt;
    $('quickSave').disabled = saveDis;
    if ($('panelQuickSave')) {
      $('panelQuickSave').textContent = saveTxt;
      $('panelQuickSave').disabled = saveDis;
    }
    $('workLabel').textContent = empty&&!recipe.id?'1 選製作類別':'1 製作類別 · '+AromaCore.categoryOf(recipe.type);
    if($('summaryBar'))$('summaryBar').hidden=$('viewRecipe').hidden||!$('recipePanel').open||$('materialPicker').open||empty;
    if($('selectionStatus'))$('selectionStatus').textContent='已選 '+recipe.items.length+' 項'+(pendingQuantities.size?' · '+pendingQuantities.size+' 項待填用量':'');
    if($('fillQuantities')){$('fillQuantities').disabled=busy||empty;$('fillQuantities').textContent=quantityMode?'返回選原料':'填寫用量（'+recipe.items.length+' 項） →';$('fillQuantities').className=quantityMode?'return-btn':'primary return-btn';}
    for(const id of ['returnToRecipe'])if($(id)){$(id).textContent='填寫用量（'+recipe.items.length+' 項） →';$(id).disabled=busy||empty;}
    stepperSync();
  }
  function focusAfterWork(){$('recipePanel').open=false;$('materialPicker').open=true;$('materialPicker').scrollIntoView({block:'start'});updateState();}
  function focusRecipe() { $('recipePanel').open=true; $('recipePanel').scrollIntoView({ block:'start' }); updateState(); }
  function rpc(action, payload = {}) {
    return new Promise((resolve, reject) => {
      if (!window.google?.script?.run) return reject(Error('此頁需透過 Apps Script 網頁應用程式開啟；本機預覽僅供示範，不連線至家庭資料。'));
      google.script.run.withSuccessHandler(r => r?.ok ? resolve(r.value) : reject(Error(r?.error || '無法辨識伺服器回應，草稿已保留')))
        .withFailureHandler(() => reject(Error('Google 連線或授權失敗。請檢查登入帳號、網路與試算表權限；草稿已保留，重試前請重新讀取確認是否已儲存。')))
        .api({ action, data: payload });
    });
  }
  async function task(fn) {
    if (busy) return;
    busy = true;
    updateState();
    const progress = '正在處理，請稍候…';
    notice(progress);
    const controls = [...document.querySelectorAll('button,input,select,textarea')].map(el => [el, el.disabled]);
    controls.forEach(([el]) => el.disabled = true);
    try { await fn(); } catch (e) { fail(e); }
    finally {
      const curText = $('noticeMsg')?.textContent || $('notice').textContent;
      if (curText === progress) notice('');
      busy = false; controls.forEach(([el, disabled]) => { if (el.isConnected) el.disabled = disabled; });
      if (!data) document.querySelectorAll('button,input,select,textarea').forEach(el => el.disabled = el.id !== 'refresh');
      else {
        document.querySelectorAll('.toolbar button,.work,#blank,#newMaterial,#addMaterials,#save,#copy,#quickSave,#panelQuickSave,#scale,#saveCost,#log,#name,#units,#notes,#base,#search,#showInactive,#recipeSearch,#recipeType,#logDate,#logUnits,#logNotes,#batchWeight,.tab-btn,.subtle-btn,.return-btn,#manageMaterialsBtn,#quickNewMaterial,#closeNotice,#helpBtn,#closeHelp,#confirmHelp,#restoreGuide,#dismissGuide,#hideGuideForever,#btnPrintRecipe,#btnResetRecipe,#modeFormulate,#modeCost,#btnGotoCost,#btnReturnFormulate').forEach(el => el.disabled = false);
        renderMaterials();
      }
      if($('targetQuantity'))$('targetQuantity').disabled=!$('fixedTotal').checked;
      updateState();
    }
  }
  function draft(keepConfirmation=false) {
    dirty = true; pendingSave = null; pendingLog = null;
    updateState();
    if (!draftKey) return;
    try { draftStorage.setItem(draftKey, JSON.stringify({...recipe,uiPendingQuantities:[...pendingQuantities],uiProductionSource:productionSource})); } catch (e) { notice('瀏覽器無法保存本機草稿，請匯出配方或先完成雲端儲存。'); }
  }
  function readInputs() {
    if(recipe.planning){recipe.planning={...recipe.planning,mode:$('planningMode').value||recipe.planning.mode,sizing:$('sizingMode').value||recipe.planning.sizing,total:$('planningTotal').value||recipe.planning.total,percent:$('planningPercent').value===''?recipe.planning.percent:$('planningPercent').value,basis:$('planningBasis').value||recipe.planning.basis,baseId:$('planningBase').value,packagingId:$('recipePackaging').value};}
    recipe.name = $('name').value; recipe.units = $('units').value; recipe.notes = $('notes').value; recipe.baseId = $('base').value;
    recipe.concentration={...recipe.concentration,auto:true,maxPercent:$('concentrationLimit').value||null,limitBasis:$('limitBasis').value||recipe.concentration?.limitBasis||'mL'};
    recipe.cost = {...recipe.cost, minutes:0, hourly:0, other:0, loss:0, margin:0, sale:null};
    if($('fixedTotal')){if($('fixedTotal').checked){const target=AromaCore.number($('targetQuantity').value,'固定總量',Number.MIN_VALUE);if(target!==recipe.targetQuantity)recipe=AromaCore.balance({...recipe,targetQuantity:target},data.materials,data.prices);}else if(recipe.targetQuantity!==null&&recipe.targetQuantity!==undefined){recipe=AromaCore.releaseTarget(recipe,data.prices);}}
  }
  function renderRecipe() {
    renderPlanner();
    recipe=AromaCore.applyDropDefaults({...recipe,concentration:{...recipe.concentration,useDefaultDrops:true}},data.materials,data.prices);
    if(!recipe.concentration?.auto){
      const previous={quantityUnit:recipe.quantityUnit,targetQuantity:recipe.targetQuantity,baseId:recipe.baseId};
      recipe.items=recipe.items.map(i=>i.unit==='%'?{...i,unit:recipe.quantityUnit,quantity:AromaCore.itemAmount(i,recipe,data.prices)}:i);
      recipe.concentration={...recipe.concentration,auto:true,legacySizing:previous};recipe.quantityUnit='mixed';recipe.targetQuantity=null;recipe.baseId='';
    }
    if(!recipe.concentration?.basis){
      const inferred=AromaCore.concentration(recipe,data.materials,data.prices).basis,legacy=recipe.concentration?.legacySizing?.quantityUnit;
      recipe.concentration={...recipe.concentration,basis:inferred||(['g','mL'].includes(legacy)?legacy:AromaCore.productBasis(recipe.type))};
    }
    $('limitBasis').value=recipe.concentration?.limitBasis||recipe.concentration.basis;$('costPanel').open=true;
    $('concentrationTotal').value=recipe.concentration?.totalMl??'';$('concentrationLimit').value=recipe.concentration?.maxPercent??'';
    $('name').value = recipe.name; $('units').value = recipe.units; $('notes').value = recipe.notes;
    $('version').textContent=AromaCore.categoryOf(recipe.type)+(productionSource?' · 實際製作':recipe.id?' · 已儲存配方':' · 新配方');
    document.querySelectorAll('.work').forEach(b => b.setAttribute('aria-pressed', String(AromaCore.categoryOf(b.dataset.type) === AromaCore.categoryOf(recipe.type))));
    $('costFields').innerHTML = '<label>每份包材費（NT$／份）<input id="cost-packaging" type="number" min="0" step="any" value="'+escape(data.cost.packaging ?? 0)+'"><small class="field-help">一份作品的瓶子、罐子、袋子或標籤費。不使用包材可填 0；新作品採用此預設。</small></label>';
    $('base').innerHTML = '<option value="">不補足，隨重量變動總量</option>' + recipe.items.map(i => `<option value="${escape(i.materialId)}">${escape(data.materials.find(m => m.id === i.materialId)?.name)}</option>`).join('');
    $('base').value = recipe.baseId;
    if($('quantityUnit'))$('quantityUnit').value=recipe.quantityUnit||'g';
    if($('fixedTotal'))$('fixedTotal').checked=recipe.targetQuantity!==null&&recipe.targetQuantity!==undefined&&recipe.targetQuantity!=='';
    if($('targetQuantity')){$('targetQuantity').value=recipe.targetQuantity??'';$('targetQuantity').disabled=!$('fixedTotal').checked;}
    if($('totalOptions'))$('totalOptions').hidden=true;
    calculate();
    renderSelected();
    updateState();
    renderMaterials();
  }
  function calculate() {
    recipe.packages=data.packages||[];
    let result;validationError='';
    try{
      const r=AromaCore.concentration(recipe,data.materials,data.prices);
      if(r.basis&&!recipe.concentration?.maxPercent)$('limitBasis').value=r.basis;
      const value=r.noOil?'未加入精油':r.available?(r.basis==='mL'||r.densityEstimated?'約 ':'')+r.percent.toFixed(2)+'% · '+(r.basis==='g'?(r.densityEstimated?'重量估算':'重量百分比'):'容量估算'):r.dropsPer100g!==null?'每 100 g 基底 '+fmt(r.dropsPer100g)+' 滴 · 添加比例':r.oilMl>0&&r.baseG>0?'精油 '+fmt(r.oilMl)+' mL／基底 '+fmt(r.baseG)+' g · 添加量':r.drops>0&&!r.allOilDropsKnown?'已知 '+fmt(r.drops)+' 滴 · 尚未完整換算':'尚無法算百分比';
      $('concentrationValue').textContent=r.available?recipe.name+' · '+value:r.noOil?'未加入精油':'濃度資料不足';$('concentrationMessage').textContent=r.available?'':r.noOil?'':'換算資料不足，請展開下方說明補齊。';$('concentrationDetailsMessage').textContent=r.message;
      $('pickerConcentrationValue').textContent=value;$('pickerConcentrationMessage').textContent=r.message+(recipe.items.some(i=>{const p=data.prices.filter(p=>p.materialId===i.materialId).at(-1);return p?.densityEstimated===true||p?.densityEstimated==='TRUE';})?' 含原料估算密度。':'');
      $('pickerConcentrationIssues').innerHTML=(r.issues||[]).map(x=>x.kind==='density'?'<button type="button" data-density="'+escape(x.materialId)+'">補 '+escape(x.name)+' 的密度</button>':'<button type="button" data-item="'+escape(x.materialId)+'">補 '+escape(x.name)+' 的用量資料</button>').join('');
      $('workBasis').textContent=(r.basis||recipe.concentration?.basis)==='g'?'重量配方 · g':'容量配方 · mL';
    }catch(e){$('concentrationValue').textContent='比例待確認';$('concentrationMessage').textContent=e.message;$('pickerConcentrationValue').textContent='比例待確認';$('pickerConcentrationMessage').textContent=e.message;}

    try { result = AromaCore.calculate({...recipe,cost:{...recipe.cost,minutes:0,hourly:0,other:0,loss:0,margin:0,sale:null}}, data.materials, data.prices, data.rules); }
    catch (e) {
      validationError=recipe.items.length?e.message:'請先選原料並填用量';
      if(!recipe.items.length)e={message:'選好原料並填用量後，這裡會顯示成本。'};
      $('summaryCost').textContent = '— / —'; $('summaryWeight').textContent = e.message; $('breakdown').textContent = e.message; $('safety').textContent = '待驗證：請先完成配方資料。'; $('summarySafety').textContent = '待驗證'; $('summarySafety').className = 'badge';
      if ($('panelCost')) { $('panelCost').textContent = '— / —'; $('panelWeight').textContent = e.message; $('panelSafety').textContent = '待驗證'; $('panelSafety').className = 'badge'; }
      if ($('formulaBar')) $('formulaBar').innerHTML = '';
      if ($('oilPercentBadge')) { $('oilPercentBadge').textContent = '精油比例待填'; $('oilPercentBadge').className = 'badge'; }
      if ($('pillUnitCost')) $('pillUnitCost').textContent = '—';
    }
    $('items').innerHTML = recipe.items.length ? recipe.items.map(i => {
      const m = data.materials.find(m => m.id === i.materialId), item = result?.items.find(x => x.materialId === i.materialId);
      return `<div class="recipe-card"><strong>${escape(m?(typeof AromaCatalog!=='undefined'?AromaCatalog.materialInfo(m).name:m.name):'原料不存在')}</strong><span>${fmt(item?.quantity??(i.unit?i.quantity:i.grams))} ${escape(i.unit||'g')} · ${item&&item.cost!==null ? money(item.cost) : '價格／用量待確認'}</span><small>每份 ${fmt((item?.quantity??(i.unit?i.quantity:i.grams))/Number(recipe.units||1))} ${escape(i.unit||'g')}</small></div>`;
    }).join('') : '<p class="empty">點原料卡加入材料，再填入用量。先選製作類別即可開始。</p>';

    if (!result){updateState();return;}
    try{AromaCore.validateConcentration(recipe,data.materials,data.prices);}catch(e){validationError=e.message;}
    $('batchWeight').value = result.total===null?'':Number(result.total.toFixed(6));
    const incomplete = !result.costComplete;

  $('breakdown').onclick=e=>{const b=e.target.closest('[data-price]');if(b)editMaterial(b.dataset.price);};
  function changeTotal(render=true){try{readInputs();draft();if(render)renderRecipe();else calculate();}catch(e){validationError=e.message;updateState();$('panelWeight').textContent=e.message;if(render)fail(e);}}
  if($('fixedTotal'))$('fixedTotal').onchange=()=>{
    if($('fixedTotal').checked&&!$('targetQuantity').value){let total=0;try{total=recipe.items.reduce((s,i)=>s+AromaCore.itemAmount(i,recipe,data.prices),0);}catch(e){}
      if(!total){$('targetQuantity').disabled=false;validationError='請填寫固定總量';updateState();notice('請填寫固定總量，再以百分比輸入材料。');return;}$('targetQuantity').value=total;
    }changeTotal();
  };
  if($('targetQuantity')){$('targetQuantity').oninput=()=>changeTotal(false);$('targetQuantity').onchange=()=>changeTotal(true);}
  $('base').onchange=()=>{try{const next={...recipe,baseId:$('base').value};if(next.baseId&&!next.targetQuantity)throw Error('請先設定固定總量，再指定補足原料');recipe=AromaCore.balance(next,data.materials,data.prices);draft();renderRecipe();}catch(e){fail(e);renderRecipe();}};
  if($('quantityUnit'))$('quantityUnit').onchange=()=>{try{const unit=$('quantityUnit').value;if(!['g','mL','mixed'].includes(unit))throw Error('計量方式不正確');let next=AromaCore.releaseTarget(recipe,data.prices);next={...next,quantityUnit:unit};if(next.items.length)AromaCore.calculate(next,data.materials,data.prices,data.rules);recipe=next;draft();renderRecipe();}catch(e){notice('這些原料的重量與容量不能直接合計，請使用「分開計量」。',true);renderRecipe();}};
  if($('migrateUnits'))$('migrateUnits').onclick=()=>task(async()=>{await rpc('migrateUnits');await refresh();notice('單位欄位已追加，舊資料保持不變。');});
  if($('showRefreshPrompt'))$('showRefreshPrompt').onclick=()=>{$('promptText').value=$('catalogRefreshPrompt').textContent.trim();$('promptDialog').showModal();$('promptText').scrollTop=0;};
  if($('closePrompt'))$('closePrompt').onclick=()=>$('promptDialog').close();
  if($('copyPrompt'))$('copyPrompt').onclick=async()=>{const box=$('promptText');let copied=false;try{await navigator.clipboard.writeText(box.value);copied=true;}catch(e){try{box.focus();box.select();copied=document.execCommand('copy');}catch(_){}}notice(copied?'已複製提示詞，貼給 Codex、Antigravity 或 Claude Code 即可。':'無法自動複製，請在提示詞框內全選後手動複製。',!copied);};
  if($('importCatalog'))$('importCatalog').onclick=()=>task(async()=>{const r=await rpc('importCatalog');await refresh();const snap=typeof AromaCatalog!=='undefined'&&AromaCatalog.snapshotDate?'（內建價格快照 '+AromaCatalog.snapshotDate+'）':'';notice(r.added>0?'已新增 '+r.added+' 筆內建官網價格批次'+snap+'；缺密度與滴數設定仍保持空白。':'沒有新項目：原料庫已包含內建官網價格'+snap+'。此功能不會連線官網更新價格。');});
  $('categories').onclick = e => { const b=e.target.closest('[data-category]'); if(b){category=b.dataset.category;oilKind='全部';materialLimit=materialPageSize();renderMaterials();} };
  if($('oilKinds'))$('oilKinds').onclick=e=>{const b=e.target.closest('[data-oil-kind]');if(b){oilKind=b.dataset.oilKind;materialLimit=materialPageSize();renderMaterials();}};
  $('search').oninput=$('showInactive').onchange=()=>{materialLimit=materialPageSize();renderMaterials();};
  if($('materialsMore'))$('materialsMore').onclick=()=>{materialLimit+=materialPageSize();renderMaterials();};
  $('recipeSearch').oninput = $('recipeType').onchange = renderSaved;
  $('newMaterial').onclick = () => editMaterial();
  if($('materials').addEventListener)$('materials').addEventListener('error',e=>{
    if(e.target?.classList?.contains('material-thumbnail')){e.target.hidden=true;e.target.parentElement?.classList?.remove('has-image');}
  },true);
  function addSelection(id, m) {
    removedSelections.delete(id);$('selectionUndo').hidden=!removedSelections.size;pendingQuantities.add(id);const latest=data.prices.filter(p=>p.materialId===id).at(-1);recipe.items.push({materialId:id,quantity:0,unit:m.category==='精油'&&(!latest||AromaCore.availableUnits(latest,m.category).includes('滴'))?'滴':['g','kg','mL','L'].includes(latest?.unit)?latest.unit:'g',priceId:latest?.id||''});
    draft();
    renderRecipe();
  }
  $('materials').onclick = e => {
    if (!data) return;
    const create = e.target.closest('[data-create]');
    if (create) { editMaterial(undefined, nextPrice => { const id = nextPrice.materialId, m = data.materials.find(x => x.id === id); if (m && !recipe.items.some(i => i.materialId === id)) addSelection(id, m); }, { prefillName: create.dataset.create }); return; }
    const gearBtn = e.target.closest('[data-gear]');
    if (gearBtn) {
      e.stopPropagation();
      const id = gearBtn.dataset.gear;
      const m = data.materials.find(x => x.id === id);
      editMaterial(id);
      return;
    }
    const card = e.target.closest('[data-add]');
    if (card) {
      const id = card.dataset.add;
      const m = data.materials.find(x => x.id === id);
      if($('materialPicker').dataset?.manage==='true'){editMaterial(id);return;}
      if (m && (m.active === false || m.active === 'FALSE')) {
        notice('此原料已停用，若需使用請先在管理中啟用。');
        return;
      }
      if (!recipe.items.some(i => i.materialId === id)) {
        addSelection(id,m);
      }
      else {
        if(recipe.baseId===id&&recipe.targetQuantity){notice('請先取消補足原料，再取消勾選。',true);return;}
        removeSelection(id);
      }
    }
  };
  $('materials').onkeydown = e => {
    if (e.key === 'Enter' || e.key === ' ') {
      const card = e.target.closest('[data-add]');
      if (card && !e.target.closest('[data-gear]')) {
        e.preventDefault();
        card.click();
      }
    }
  };
  $('closeEditor').onclick = () => {quantityQueue=[];$('editor').close();};
  $('editorForm').onsubmit = e => { e.preventDefault(); try { editorAction(); } catch(e){fail(e);} };
  if ($('save')) $('save').onclick = () => task(save);
  if ($('quickSave')) $('quickSave').onclick = () => task(save);
  if ($('panelQuickSave')) $('panelQuickSave').onclick = () => task(save);
  const handleDisabledSaveClick = btn => {
    if (btn && btn.parentElement) {
      btn.parentElement.onclick = () => {
        if (btn.disabled && !busy && data) {
          if (!recipe?.items.length) notice('請先加入原料才能儲存配方。可按「新增自製配方」選擇製作類別。');
          else if (recipe.id && !dirty) notice('目前版本（v' + recipe.version + '）已儲存，無須重複儲存。');
        }
      };
    }
  };
  handleDisabledSaveClick($('quickSave'));
  handleDisabledSaveClick($('panelQuickSave'));
  $('copy').onclick = () => { recipe={...recipe,id:'',version:0,name:recipe.name+'（複製）'}; delete recipe.snapshot; draft();renderRecipe();notice('已複製為新配方草稿；請儲存建立第一版。'); };
  if($('showArchived'))$('showArchived').onchange=renderSaved;
  $('saved').onclick = async e => {
    const remove=e.target.closest('[data-delete]');
    if(remove){if(!await confirmChange('永久移除此配方？','配方內容將永久刪除，無法還原；過去的製作紀錄與成本快照保留。','永久移除'))return;return task(async()=>{await rpc('deleteRecipe',{id:remove.dataset.delete,requestId:uid(),policyVersion:2});if(recipe.id===remove.dataset.delete){productionSource=null;recipe=blank(recipe.type);dirty=false;}await refresh();notice('配方已永久移除，製作紀錄保留。');});}
    const produce=e.target.closest('[data-produce]');if(produce){if(dirty&&!await confirmChange('開始製作？','目前草稿有未儲存修改，是否改用已儲存配方？','放棄並載入'))return;return task(async()=>{recipe=await rpc('loadRecipe',{id:produce.dataset.produce,current:true});upgradePlanning();beginProduction();});}
    const b=e.target.closest('[data-load]'); if(!b)return;
    const target=data.recipes.find(r=>r.id===b.dataset.load && Number(r.version)===Number(b.dataset.version));
    if(dirty && !await confirmChange('載入配方？','目前有未儲存的修改，要放棄並載入「'+(target?.name || '配方')+'」嗎？','放棄並載入')) return;
    return task(async()=>{
      productionSource=null;recipe=await rpc('loadRecipe',{id:b.dataset.load,version:Number(b.dataset.version),current:true});upgradePlanning();
      dirty=false;pendingSave=null;pendingLog=null;pendingQuantities.clear();removedSelections.clear();quantityMode=false;
      $('workPanel').open=false;
      switchTab('tabRecipe');
      renderRecipe();
      focusRecipe();
      notice('已載入配方，依最新原料與包材價格試算。');
    });
  };
  $('refresh').onclick = () => task(async()=>{await refresh();notice('已重新讀取雲端資料；目前配方草稿保留。');});
  $('saveCost').onclick = () => task(async()=>{const next={...data.cost,packaging:AromaCore.number($('cost-packaging').value,'每份包材費'),minutes:0,hourly:0,other:0,loss:0,margin:0,sale:null};await rpc('saveCost',{cost:next,revision:data.costRevision});recipe.cost={...recipe.cost,packaging:next.packaging};draft();await refresh();notice('包材價格已套用目前配方；儲存配方後建立新版本，歷史成本保持原值。');});
  $('export').onclick = () => task(async()=>{
    const exported=await rpc('export'); exported.localDraft=recipe;
    const url=URL.createObjectURL(new Blob([JSON.stringify(exported,null,2)],{type:'application/json'}));
    const a=document.createElement('a');a.href=url;a.download='AromaCraft-備份-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),5000);notice('已匯出 8 張工作表及目前草稿。請另以 Google 試算表「建立副本」備份，JSON 不提供自動還原。');
  });
  $('recover').onclick = async () => {try{
    const s=draftStorage.getItem(draftKey); if(!s) return notice('此帳號沒有本機草稿。');
    const restored=JSON.parse(s);if(!Array.isArray(restored.items)||!restored.cost||!AromaCore.TYPES.includes(restored.type)) throw Error('草稿格式不正確');
    if(dirty && !await confirmChange('要恢復本機草稿嗎？','恢復草稿「'+restored.name+'」','取代目前修改')) return;
    recipe=restored;productionSource=restored.uiProductionSource||null;delete recipe.uiProductionSource;pendingQuantities.clear();for(const id of restored.uiPendingQuantities||[])pendingQuantities.add(id);delete recipe.uiPendingQuantities;quantityMode=true;dirty=true;pendingSave=null;renderRecipe();notice('已恢復本機草稿，尚未存入雲端。');
  }catch(e){fail(e);} };
  async function finishProduction(){
    if(!productionSource){if(dirty||!recipe.id)await save();beginProduction();notice('已帶入配方，可調整實際用量；做好後再按完成製作。');return;}
    readInputs();if(pendingQuantities.size||validationError)throw Error('請先完成實際用量');
    if(!pendingLog)pendingLog={policyVersion:2,recipeId:productionSource.id,version:productionSource.version,date:$('productionDate').value,units:recipe.units,notes:recipe.notes,actualRecipe:JSON.parse(JSON.stringify(recipe)),requestId:uid()};
    await rpc('saveLog',pendingLog);try{draftStorage.removeItem(draftKey);}catch(e){}pendingLog=null;recipe=productionSource;productionSource=null;dirty=false;await refresh();notice('已保存當次實際用量與成本快照，原配方未變更。');
  }
  $('recordProduction').onclick=()=>task(finishProduction);$('log').onclick=()=>{if(productionSource){switchTab('tabRecipe');focusRecipe();}else{switchTab('tabSaved');notice('請選一份配方開始製作，核對實際用量後再完成。');}};
  $('productionDate').value=new Intl.DateTimeFormat('sv-SE',{timeZone:'Asia/Taipei',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
  $('logDate').value=new Intl.DateTimeFormat('sv-SE',{timeZone:'Asia/Taipei',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date()); $('logUnits').value=1;
  window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue='';}});
  if ($('costPanel')) $('costPanel').open = window.innerWidth >= 768;
  $('materialPicker').open=false;$('recipePanel').open=false;$('workPanel').open=true;
  if(window.matchMedia){const desktop=window.matchMedia('(min-width:1100px)');desktop.addEventListener('change',()=>{materialLimit=materialPageSize();if(data)renderMaterials();});}
  if ($('btnPrintRecipe')) {
    $('btnPrintRecipe').onclick = () => {
      if (!recipe?.items.length) { notice('請先加入原料才能列印配方工作單。'); return; }
      window.print();
    };
  }
  if ($('btnResetRecipe')) {
    $('btnResetRecipe').onclick = async () => {
      if (!recipe?.items.length) return;
      if (await confirmChange('要清空配方原料嗎？', '清空目前配方中已加入的所有原料', '清空原料')) {
        recipe.items = [];
        recipe.baseId = '';
        draft();
        renderRecipe();
        notice('已清空目前配方原料。可重新挑選原料或新增自製配方。');
      }
    };
  }
  // Google 部署使用試算表，不顯示僅供獨立網站使用的 Firebase 登入面板。
  if(!window.AROMA_LOCAL&&!window.AROMA_DEMO){
    if($('cloudSyncPanel'))$('cloudSyncPanel').hidden=true;
    if($('syncStatusText'))$('syncStatusText').textContent='Google 試算表';
    if($('storageDescription'))$('storageDescription').textContent='本機草稿保存在此瀏覽器；此版本的正式資料保存於 Google 試算表。';
  }

  function upgradePlanning(){if(!recipe.planning)recipe.planning={mode:'free',sizing:'batch',total:30,percent:1,basis:AromaCore.productBasis(recipe.type),baseId:'',packagingId:''};recipe.policyVersion=2;}
  function renderPlanner(){
    upgradePlanning();const p=recipe.planning;recipe.items=recipe.items.map(i=>({...i,priceId:data.prices.filter(x=>x.materialId===i.materialId).at(-1)?.id||''}));
    for(const [id,key]of [['planningMode','mode'],['sizingMode','sizing'],['planningTotal','total'],['planningPercent','percent'],['planningBasis','basis']])$(id).value=p[key];
    $('targetFields').hidden=p.mode!=='target';$('unitsLabel').textContent=p.sizing==='perUnit'?'本次製作幾份':'本次分成幾份';
    $('sizingHelp').textContent=p.sizing==='perUnit'?'下方填每份用量，系統乘以製作份數；目標總量也是每份總量。':'下方填整批用量，系統依份數分攤；目標總量是整批總量。';
    $('plannerSummary').textContent='進階：'+(p.mode==='target'?'依目標調配':'自由填量')+'（點此更改）';if(p.mode==='target')$('plannerAdvanced').open=true;
    $('planningBase').innerHTML='<option value="">選擇補足原料</option>'+recipe.items.filter(i=>data.materials.find(m=>m.id===i.materialId)?.category!=='精油').map(i=>'<option value="'+escape(i.materialId)+'">'+escape(data.materials.find(m=>m.id===i.materialId)?.name)+'</option>').join('');$('planningBase').value=p.baseId;
    $('recipePackaging').innerHTML='<option value="">不使用包材</option>'+(data.packages||[]).map(x=>'<option value="'+escape(x.id)+'">'+escape(x.name)+' · '+money(x.price)+'／份</option>').join('');$('recipePackaging').value=p.packagingId;
    $('packageList').innerHTML=(data.packages||[]).map(x=>'<p>'+escape(x.name)+' · '+money(x.price)+'／份 <button data-package="'+escape(x.id)+'">編輯</button></p>').join('')||'<p class="muted">尚無包材，可新增一份整套費用。</p>';
  }
  function updateTargetProgress(){
    try{const r=AromaCore.targetProgress(recipe,data.materials,data.prices);if(!r){$('targetProgress').textContent='';return;}
      const prepared=AromaCore.prepare(recipe,data.materials,data.prices,data.packages||[]),base=prepared.items.find(i=>i.materialId===recipe.planning.baseId);
      if(base){pendingQuantities.delete(base.materialId);const input=$('quantity-'+base.materialId);if(input){const select=$('quantity-unit-'+base.materialId);if(select){if(!AromaCore.availableUnits(AromaCore.itemPrice(base,data.prices),data.materials.find(m=>m.id===base.materialId)?.category).includes(base.unit))select.innerHTML+='<option>'+escape(base.unit)+'</option>';select.value=base.unit;select.disabled=true;}input.value=recipe.planning.sizing==='perUnit'?base.quantity/Number(recipe.units):base.quantity;input.disabled=true;}}
      $('targetProgress').textContent=(r.issues.length?'缺少換算資料，尚無法核對分配':r.targetDrops!==null?'已分配 '+fmt(r.drops)+'／約 '+fmt(r.targetDrops)+' 滴（依原料換算估算）':'已分配 '+fmt(r.allocated)+'／'+fmt(r.budget)+' '+r.basis+' 精油')+(r.over?'；已超過目標，仍可儲存':'')+(r.missingBase?'；請選擇補足原料':'');
    }catch(e){$('targetProgress').textContent=e.message;}
  }
  function changePlanning(){try{if(recipe.planning?.mode==='target'&&$('planningMode').value==='free'){const prepared=AromaCore.prepare(recipe,data.materials,data.prices,data.packages||[]),factor=recipe.planning.sizing==='perUnit'?Number(recipe.units):1;recipe.items=prepared.items.map(i=>({...i,quantity:i.quantity/factor}));}readInputs();draft();$('targetFields').hidden=recipe.planning.mode!=='target';renderRecipe();}catch(e){notice(e.message,true);}}
  for(const id of ['planningMode','sizingMode','planningBasis','planningBase','recipePackaging'])$(id).onchange=changePlanning;
  for(const id of ['planningTotal','planningPercent'])$(id).onchange=changePlanning;
  function beginProduction(){productionSource=JSON.parse(JSON.stringify(recipe));const prepared=AromaCore.prepare(recipe,data.materials,data.prices,data.packages||[]);recipe={...recipe,items:prepared.items.map(i=>({...i})),planning:{...recipe.planning,mode:'free',sizing:'batch'}};dirty=false;pendingQuantities.clear();quantityMode=true;renderRecipe();$('workPanel').open=false;switchTab('tabRecipe');$('materialPicker').open=true;$('recipePanel').open=true;const details=$('recordProduction').closest?.('details');if(details)details.open=true;$('selectedItemsTitle').scrollIntoView({block:'start'});}
  $('cancelProduction').onclick=async()=>{if(!productionSource)return;if(dirty&&!await confirmChange('返回原配方？','尚未完成的實際用量將捨棄，原配方不變。','返回原配方'))return;recipe=productionSource;productionSource=null;dirty=false;pendingQuantities.clear();renderRecipe();};
  $('saveAsNew').onclick=()=>task(async()=>{if(productionSource)throw Error('請先完成製作或返回原配方');recipe={...recipe,id:'',version:0,name:recipe.name+'（副本）'};draft();renderRecipe();await save();});
  function editPackage(id){const p=(data.packages||[]).find(p=>p.id===id)||{id:uid(),name:'',price:''};openEditor(id?'編輯包材':'新增包材',input('包材名稱（含整套用品）','packageName',p.name,'text','required maxlength="100"')+input('每份整套費用（NT$）','packagePrice',p.price,'number','required min="0" step="any"'),()=>task(async()=>{await rpc('savePackage',{...p,name:$('packageName').value,price:$('packagePrice').value,requestId:uid()});$('editor').close();await refresh();notice('包材已儲存，配方採最新單價，歷史製作成本保留。');}));}
  $('newPackage').onclick=()=>editPackage();$('packageList').onclick=e=>{const b=e.target.closest('[data-package]');if(b)editPackage(b.dataset.package);};

  switchManage('manageBasics');
  task(()=>refresh());
})();
</script>
