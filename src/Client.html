<script>
(() => {
  'use strict';
  const $ = id => document.getElementById(id);
  const money = n => 'NT$' + new Intl.NumberFormat('zh-TW', { minimumFractionDigits: 2, maximumFractionDigits: 2 }).format(n);
  const fmt = n => Number(n).toLocaleString('zh-TW', { maximumFractionDigits: 4 });
  const escape = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
  const uid = () => crypto.randomUUID ? crypto.randomUUID() : Date.now() + '-' + Math.random().toString(36).slice(2);
  const draftStorage = window.AROMA_DEMO ? sessionStorage : localStorage;

  function confirmChange(title, target, action) {
    if ($('confirmDialog').open) return Promise.resolve(false);
    return new Promise(resolve=>{
      $('confirmTitle').textContent=title;
      $('confirmMessage').textContent=target;
      $('confirmKeep').textContent=action==='放棄並切換'||action==='放棄並載入'?'繼續編輯':'取消';
      $('confirmProceed').textContent=action;
      const finish=value=>{ $('confirmDialog').close();resolve(value); };
      $('confirmKeep').onclick=()=>finish(false);
      $('confirmProceed').onclick=()=>finish(true);
      $('confirmDialog').oncancel=e=>{e.preventDefault();finish(false);};
      $('confirmDialog').showModal();$('confirmKeep').focus();
    });
  }
  const materialPageSize=()=>window.innerWidth<768?8:24;
  let materialLimit=materialPageSize(),validationError='';
  let data, recipe, category = '全部', oilKind = '全部', busy = false, dirty = false, editorAction, pendingSave, pendingLog, draftKey, noticeTimer = null;
  const blank = type => ({ id: '', version: 0, name: type + '新配方', type, quantityUnit:'mixed',targetQuantity:null, units: 1, notes: '', baseId: '', items: [], cost: { ...data.cost, minutes:0, hourly:0, other:0, loss:0, margin:0, sale:null } });

  function notice(message, isError = false) {
    if (noticeTimer && typeof clearTimeout === 'function') { clearTimeout(noticeTimer); noticeTimer = null; }
    const el = $('notice'), msgEl = $('noticeMsg');
    if (!message) {
      el.hidden = true;
      if (msgEl) msgEl.textContent = '';
      else el.textContent = '';
      return;
    }
    if (msgEl) msgEl.textContent = message;
    else el.textContent = message;
    el.className = isError ? 'alert-error' : '';
    el.hidden = false;
    if (!isError && message !== '正在處理，請稍候…' && typeof setTimeout === 'function') {
      noticeTimer = setTimeout(() => { notice(''); }, 3500);
    }
  }

  function fail(e) {
    const message = e.message || String(e);
    if ($('editor').open) {
      $('editorError').textContent = message;
      $('editorError').hidden = false;
    } else {
      notice(message, true);
    }
  }

  let recipePickerOpen=false;
  function switchTab(target) {
    const picker=$('materialPicker'), owner=$(target==='tabManage'?'manageMaterialSlot':'viewRecipe');
    const fromManage=picker?.dataset?.manage==='true';
    if(target==='tabManage'&&!fromManage)recipePickerOpen=picker.open;
    if(target==='tabRecipe'&&(fromManage||window.innerWidth>=1100))picker.open=window.innerWidth>=1100||recipePickerOpen;
    if(picker&&target!=='tabSaved'){if(target==='tabRecipe'&&owner?.insertBefore&&$('recipeWorkspace'))owner.insertBefore(picker,$('recipeWorkspace'));else if(owner?.append)owner.append(picker);}
    if(target!=='tabSaved'){
      if(picker?.dataset)picker.dataset.manage=String(target==='tabManage');
      if(target==='tabManage'){picker.open=true;switchManage('manageBasics');}
      if($('materialPickerTitle'))$('materialPickerTitle').textContent=target==='tabManage'?'原料與價格':'2 挑選原料';
      if($('materialPickerHint'))$('materialPickerHint').textContent=target==='tabManage'?'點卡片編輯名稱、容量與價格':'搜尋後點卡片加入';
    }
    const tabMap = [
      ['tabRecipe', 'viewRecipe'],
      ['tabSaved', 'viewSaved'],
      ['tabManage', 'viewManage']
    ];
    tabMap.forEach(([btnId, viewId]) => {
      const btn = $(btnId), view = $(viewId);
      if (!btn || !view) return;
      const active = btnId === target;
      btn.className = active ? 'tab-btn active' : 'tab-btn';
      if (btn.setAttribute) btn.setAttribute('aria-selected', String(active));
      view.hidden = !active;
    });
    if(data&&target!=='tabSaved')renderMaterials();
  }

  function switchManage(target){
    [['manageBasics','manageBasicsBtn'],['manageRecords','manageRecordsBtn'],['manageData','manageDataBtn']].forEach(([id,btn])=>{
      $(id).hidden=id!==target;$(btn).setAttribute('aria-pressed',String(id===target));
    });
  }
  if($('manageBasicsBtn'))$('manageBasicsBtn').onclick=()=>switchManage('manageBasics');
  if($('manageRecordsBtn'))$('manageRecordsBtn').onclick=()=>switchManage('manageRecords');
  if($('manageDataBtn'))$('manageDataBtn').onclick=()=>switchManage('manageData');
  if($('manageCatalogSlot')?.append&&$('ylCatalog'))$('manageCatalogSlot').append($('ylCatalog'));
  let currentWorkMode = 'formulate';
  function switchWorkMode(mode) {
    currentWorkMode = mode;
    const view = $('viewRecipe');
    if (view) {
      if (view.dataset) view.dataset.mode = 'share';
      else if (view.setAttribute) view.setAttribute('data-mode', 'share');
    }
    const isFormulate = mode === 'formulate';
    if ($('modeFormulate')) {
      $('modeFormulate').className = isFormulate ? 'mode-btn active' : 'mode-btn';
      if ($('modeFormulate').setAttribute) $('modeFormulate').setAttribute('aria-selected', String(isFormulate));
    }
    if ($('modeCost')) {
      $('modeCost').className = !isFormulate ? 'mode-btn active' : 'mode-btn';
      if ($('modeCost').setAttribute) $('modeCost').setAttribute('aria-selected', String(!isFormulate));
    }
    if (mode === 'cost') {
      switchTab('tabRecipe');
      if ($('costPanel')) $('costPanel').open = true;
      if ($('costPanel')?.scrollIntoView) $('costPanel').scrollIntoView({ behavior: 'smooth', block: 'start' });
    } else {
      if ($('materialPicker')) $('materialPicker').open = true;
      focusRecipe();
    }
  }

  function updateState() {
    if (!recipe) return;
    if(data){if($('migrateUnits'))$('migrateUnits').hidden=!data.admin;if($('importCatalog')){$('importCatalog').hidden=!data.admin;$('importCatalog').disabled=busy||!data.unitSchema;}}
    const empty = !recipe.items.length;
    const pendingTemplate = (recipe.notes||'').includes('[範本待確認]');
    $('draftState').textContent = empty ? (pendingTemplate ? '範本待確認 · 未加入原料' : '未加入原料') : dirty ? '尚有未儲存變更' : recipe.id ? '已儲存 · v' + recipe.version : '尚未儲存';
    const saveTxt = busy ? '處理中…' : recipe.id ? '儲存新版本' : '儲存配方';
    const saveDis = busy || !data || empty || !!validationError || (!!recipe.id && !dirty);
    $('quickSave').textContent = saveTxt;
    $('quickSave').disabled = saveDis;
    if ($('panelQuickSave')) {
      $('panelQuickSave').textContent = saveTxt;
      $('panelQuickSave').disabled = saveDis;
    }
    $('workLabel').textContent = empty&&!pendingTemplate&&!recipe.id?'1 選作品':'1 作品 · '+recipe.type;
    for(const id of ['returnToRecipe','mobileReviewRecipe'])if($(id)){$(id).textContent='查看配方與成本（'+recipe.items.length+' 項） ↓';$(id).disabled=busy||empty;}
  }
  function focusAfterWork(){if(window.innerWidth<768){$('materialPicker').open=true;$('materialPicker').scrollIntoView({block:'start'});}else focusRecipe();}
  function focusRecipe() { $('recipePanel').scrollIntoView({ block:'start' }); }
  function rpc(action, payload = {}) {
    return new Promise((resolve, reject) => {
      if (!window.google?.script?.run) return reject(Error('此頁需透過 Apps Script 網頁應用程式開啟；本機預覽僅供示範，不連線至家庭資料。'));
      google.script.run.withSuccessHandler(r => r?.ok ? resolve(r.value) : reject(Error(r?.error || '無法辨識伺服器回應，草稿已保留')))
        .withFailureHandler(() => reject(Error('Google 連線或授權失敗。請檢查登入帳號、網路與試算表權限；草稿已保留，重試前請重新讀取確認是否已儲存。')))
        .api({ action, data: payload });
    });
  }
  async function task(fn) {
    if (busy) return;
    busy = true;
    updateState();
    const progress = '正在處理，請稍候…';
    notice(progress);
    const controls = [...document.querySelectorAll('button,input,select,textarea')].map(el => [el, el.disabled]);
    controls.forEach(([el]) => el.disabled = true);
    try { await fn(); } catch (e) { fail(e); }
    finally {
      const curText = $('noticeMsg')?.textContent || $('notice').textContent;
      if (curText === progress) notice('');
      busy = false; controls.forEach(([el, disabled]) => { if (el.isConnected) el.disabled = disabled; });
      if (!data) document.querySelectorAll('button,input,select,textarea').forEach(el => el.disabled = el.id !== 'refresh');
      else {
        document.querySelectorAll('.toolbar button,.work,#blank,#newMaterial,#addMaterials,#save,#copy,#quickSave,#panelQuickSave,#scale,#saveCost,#log,#name,#units,#notes,#base,#search,#showInactive,#recipeSearch,#recipeType,#logDate,#logUnits,#logNotes,#batchWeight,.tab-btn,.subtle-btn,.return-btn,#manageMaterialsBtn,#quickNewMaterial,#closeNotice,#helpBtn,#closeHelp,#confirmHelp,#restoreGuide,#dismissGuide,#hideGuideForever,#btnPrintRecipe,#btnResetRecipe,#modeFormulate,#modeCost,#btnGotoCost,#btnReturnFormulate').forEach(el => el.disabled = false);
        renderMaterials();
      }
      if($('targetQuantity'))$('targetQuantity').disabled=!$('fixedTotal').checked;
      updateState();
    }
  }
  function draft(keepConfirmation=false) {
    dirty = true; pendingSave = null; pendingLog = null;
    updateState();
    if (!draftKey) return;
    try { draftStorage.setItem(draftKey, JSON.stringify(recipe)); } catch (e) { notice('瀏覽器無法保存本機草稿，請匯出配方或先完成雲端儲存。'); }
  }
  function readInputs() {
    recipe.name = $('name').value; recipe.units = $('units').value; recipe.notes = $('notes').value; recipe.baseId = $('base').value;
    recipe.concentration={totalMl:$('concentrationTotal').value||null,maxPercent:$('concentrationLimit').value||null};
    recipe.cost = {...recipe.cost, minutes:0, hourly:0, other:0, loss:0, margin:0, sale:null};
    if($('fixedTotal')){if($('fixedTotal').checked){const target=AromaCore.number($('targetQuantity').value,'固定總量',Number.MIN_VALUE);if(target!==recipe.targetQuantity)recipe=AromaCore.balance({...recipe,targetQuantity:target},data.materials,data.prices);}else if(recipe.targetQuantity!==null&&recipe.targetQuantity!==undefined){recipe=AromaCore.releaseTarget(recipe,data.prices);}}
  }
  function renderRecipe() {
    $('concentrationTotal').value=recipe.concentration?.totalMl??'';$('concentrationLimit').value=recipe.concentration?.maxPercent??'';
    $('name').value = recipe.name; $('units').value = recipe.units; $('notes').value = recipe.notes;
    $('version').textContent = ((recipe.notes||'').includes('[範本待確認]')?'範本待確認 · ':'') + recipe.type + (recipe.id ? ' · 目前版本 v' + recipe.version + '，修改後另存新版' : ' · 新配方') + (recipe.snapshot ? ' · 沿用此版本採購價格；歷史快照保留' : '');
    document.querySelectorAll('.work').forEach(b => b.setAttribute('aria-pressed', String(recipe.items.length > 0 && b.dataset.type === recipe.type)));
    $('costFields').innerHTML = '<label>每份包材費（NT$／份）<input id="cost-packaging" type="number" min="0" step="any" value="'+escape(data.cost.packaging ?? 0)+'"><small class="field-help">一份作品的瓶子、罐子、袋子或標籤費。不使用包材可填 0；新作品採用此預設。</small></label>';
    $('base').innerHTML = '<option value="">不補足，隨重量變動總量</option>' + recipe.items.map(i => `<option value="${escape(i.materialId)}">${escape(data.materials.find(m => m.id === i.materialId)?.name)}</option>`).join('');
    $('base').value = recipe.baseId;
    if($('quantityUnit'))$('quantityUnit').value=recipe.quantityUnit||'g';
    if($('fixedTotal'))$('fixedTotal').checked=recipe.targetQuantity!==null&&recipe.targetQuantity!==undefined&&recipe.targetQuantity!=='';
    if($('targetQuantity')){$('targetQuantity').value=recipe.targetQuantity??'';$('targetQuantity').disabled=!$('fixedTotal').checked;}
    if($('totalOptions'))$('totalOptions').hidden=recipe.quantityUnit==='mixed';
    calculate();
    updateState();
    renderMaterials();
  }
  function calculate() {
    let result;validationError='';
    try{const r=AromaCore.concentration(recipe,data.materials,data.prices);$('concentrationValue').textContent=r.available?r.percent.toFixed(2)+'% · 精油約 '+fmt(r.oilMl)+' mL':'濃度待確認';$('concentrationMessage').textContent=r.message;$('concentrationTitle').parentElement?.setAttribute('data-warning',String(r.overLimit||r.totalMismatch));}catch(e){$('concentrationValue').textContent='濃度待確認';$('concentrationMessage').textContent=e.message;}
    try { result = AromaCore.calculate({...recipe,cost:{...recipe.cost,minutes:0,hourly:0,other:0,loss:0,margin:0,sale:null}}, data.materials, data.prices, data.rules); }
    catch (e) {
      validationError=e.message;
      $('summaryCost').textContent = '— / —'; $('summaryWeight').textContent = e.message; $('breakdown').textContent = e.message; $('safety').textContent = '待驗證：請先完成配方資料。'; $('summarySafety').textContent = '待驗證'; $('summarySafety').className = 'badge';
      if ($('panelCost')) { $('panelCost').textContent = '— / —'; $('panelWeight').textContent = e.message; $('panelSafety').textContent = '待驗證'; $('panelSafety').className = 'badge'; }
      if ($('formulaBar')) $('formulaBar').innerHTML = '';
      if ($('oilPercentBadge')) { $('oilPercentBadge').textContent = '精油 0%'; $('oilPercentBadge').className = 'badge'; }
      if ($('pillUnitCost')) $('pillUnitCost').textContent = '—';
    }
    $('items').innerHTML = recipe.items.length ? recipe.items.map(i => {
      const m = data.materials.find(m => m.id === i.materialId), item = result?.items.find(x => x.materialId === i.materialId);
      return `<button class="recipe-card" data-item="${escape(i.materialId)}" data-category="${escape(m?.category||'其他')}"><strong>${escape(m?(typeof AromaCatalog!=='undefined'?AromaCatalog.materialInfo(m).name:m.name):'原料不存在')}</strong><span>${fmt(i.unit?i.quantity:i.grams)} ${escape(i.unit||'g')} · ${item ? (item.percent===null?'':fmt(item.percent)+'% · ')+money(item.cost) : '請完成用量設定'}</span></button>`;
    }).join('') : '<p class="empty">點原料卡加入材料，再填入用量。也可先選作品範本。</p>';
    if (!result){updateState();return;}
    try{AromaCore.validateConcentration(recipe,data.materials,data.prices);}catch(e){validationError=e.message;}
    $('batchWeight').value = result.total===null?'':Number(result.total.toFixed(6));
    const incomplete = recipe.items.some(i=>Number(data.prices.find(p=>p.id===i.priceId)?.paid)===0);
    const costText = incomplete ? '價格待補，估算不完整' : money(result.batch) + ' / ' + money(result.perUnit);
    const weightText = result.quantityUnit==='mixed'?Object.entries(result.totals).map(([u,n])=>fmt(n)+' '+u).join('；')+'（分開計量） · '+result.units+' 份':fmt(result.total)+' '+result.quantityUnit+' · '+result.units+' 份 · 每份 '+fmt(result.quantityPerUnit)+' '+result.quantityUnit;
    const safetyText = result.safety;
    const safetyClass = 'badge' + (result.safety === '超出限制' ? ' warn' : '');
    $('summaryCost').textContent = costText;
    $('summaryWeight').textContent = weightText;
    $('summarySafety').textContent = safetyText; $('summarySafety').className = safetyClass;
    if ($('pillUnitCost')) {
      const unitMat = (result.units > 0 && Number.isFinite(result.material)) ? (result.material / result.units) : 0;
      $('pillUnitCost').textContent = costText;
    }
    if ($('panelCost')) {
      $('panelCost').textContent = costText;
      $('panelWeight').textContent = weightText;
      $('panelSafety').textContent = safetyText;
      $('panelSafety').className = safetyClass;
    }
    if ($('formulaBar')) {
      const catMap = { '皂基': 'seg-soap', '基底油': 'seg-oil', '蜂蠟': 'seg-wax', '精油': 'seg-essential', '其他': 'seg-other' };
      const totalsByCat = {};
      result.items.forEach(it => { totalsByCat[it.category] = (totalsByCat[it.category] || 0) + it.percent; });
      $('formulaBar').innerHTML = Object.entries(totalsByCat).map(([cat, pct]) => {
        const cls = catMap[cat] || 'seg-other';
        return `<div class="formula-segment ${cls}" style="width:${pct.toFixed(2)}%" title="${escape(cat)} · ${pct.toFixed(1)}%"></div>`;
      }).join('');
    }
    if ($('oilPercentBadge')) {
      const oilPct = result.oilPercent || 0;
      $('oilPercentBadge').textContent = result.quantityUnit==='mixed'?'材料成本試算':'精油 '+oilPct.toFixed(1)+'%（'+(result.quantityUnit==='mL'?'體積':'重量')+'）';
      const isWarn = result.safety === '超出限制';
      $('oilPercentBadge').className = 'badge' + (isWarn ? ' warn' : '');
      $('oilPercentBadge').title = (result.quantityUnit==='mixed'?'分開計量，不計總濃度。':'已計算精油總濃度；')+'用途安全狀態：'+result.safety+'。請核對安全來源。';
    }
    $('safety').innerHTML = result.messages.map(m => '<p>' + escape(m) + '</p>').join('');
    const row=(label,value)=>`<div class="cost-row"><span>${label}</span><strong>${value}</strong></div>`;
    const noPrice=recipe.items.some(i=>Number(data.prices.find(p=>p.id===i.priceId)?.paid)===0);
    $('breakdown').innerHTML = `<h3>材料與包材估算</h3>${row('材料費',money(result.material))}${row('包材費（'+result.units+' 份）',money(result.packaging))}<div class="cost-total">${row('本次總成本',money(result.batch))}${row('每份大約成本',money(result.perUnit))}</div><p class="muted">只計材料與包材；不計工時、毛利或售價。材料價格與配比仍需核對。</p>${noPrice?'<p class="price-warning">部分原料目前是零元示範價格，成本估算不完整。請在設定頁填入實際價格。</p>':''}`;
    updateState();
  }
  function renderMaterials() {
    const search = $('search').value.trim().toLowerCase();
    const describe=(m,p)=>typeof AromaCatalog!=='undefined'?AromaCatalog.materialInfo(m,p):{kind:m.category==='精油'?'待分類':m.category,name:m.name,amount:p?.amount,unit:p?.unit,paid:p?.paid,priceLabel:'採購價'};
    const active=data.materials.filter(m=>$('showInactive').checked||m.active===true||m.active==='TRUE');
    const list = active.filter(m => (category === '全部' || m.category === category) && (category!=='精油'||oilKind==='全部'||describe(m).kind===oilKind) && (m.name+' '+m.note+' '+m.id).toLowerCase().includes(search));
    const catLabels = { '全部':'🌿 全部', '精油':'💧 精油', '皂基':'🧼 皂基', '蜂蠟':'🍯 蜂蠟', '基底油':'🫒 基底油', '其他':'📦 其他' };
    $('categories').innerHTML = ['全部','精油','皂基','蜂蠟','基底油','其他'].map(c => `<button data-category="${c}" aria-pressed="${c === category}">${catLabels[c] || c}</button>`).join('');
    if($('oilKinds')){
      $('oilKinds').hidden=category!=='精油';
      const oils=active.filter(m=>m.category==='精油');
      $('oilKinds').innerHTML=['全部','單方','複方','待分類'].map(kind=>{const count=oils.filter(m=>kind==='全部'||describe(m).kind===kind).length;return count?`<button type="button" data-oil-kind="${kind}" aria-pressed="${kind===oilKind}">${kind} ${count}</button>`:'';}).join('');
    }
    if($('materialCount'))$('materialCount').textContent='找到 '+list.length+' 筆，顯示 '+Math.min(materialLimit,list.length)+' 筆';
    if($('materialsMore')){$('materialsMore').hidden=materialLimit>=list.length;$('materialsMore').textContent='再顯示 '+materialPageSize()+' 筆原料';}
    $('materials').innerHTML = list.slice(0,materialLimit).map(m => {
      const inRecipe = recipe?.items.some(i => i.materialId === m.id);
      const item = recipe?.items.find(i => i.materialId === m.id);
      const latestPrice = data.prices.filter(p => p.materialId === m.id).at(-1);
      const info=describe(m,latestPrice);
      const bottleMoney=latestPrice?new Intl.NumberFormat('zh-TW',{style:'currency',currency:'TWD',minimumFractionDigits:0,maximumFractionDigits:2}).format(info.paid):'';
      const priceText=latestPrice?fmt(info.amount)+' '+(info.unit==='mL'?'mL':escape(info.unit))+' · '+info.priceLabel+' '+bottleMoney:'尚未設定採購價格';
      return `<article class="material-card ${info.image?'has-thumbnail':''} ${inRecipe ? 'in-recipe' : ''} ${m.active === false || m.active === 'FALSE' ? 'inactive' : ''}" data-add="${escape(m.id)}" data-category="${escape(m.category)}" data-oil-kind="${escape(info.kind)}" role="button" tabindex="0" aria-label="${escape(info.name)}，${$('materialPicker').dataset?.manage==='true'?'編輯名稱、容量與價格':inRecipe?'已加入配方，點擊編輯用量':'點擊加入配方'}">
        <div class="mat-card-header">
          <span class="badge">${escape(info.kind)}</span>
          ${info.image?`<span class="mat-picture has-image" aria-hidden="true"><img class="material-thumbnail" src="${escape(info.image)}" width="44" height="54" loading="lazy" decoding="async" referrerpolicy="no-referrer" alt=""></span>`:''}
          <button type="button" class="mat-gear" data-gear="${escape(m.id)}" aria-label="管理 ${escape(m.name)} 原料與價格" title="管理原料與價格">⚙️</button>
        </div>
        <h3 class="mat-name">${escape(info.name)}</h3>
        <p class="mat-meta">${priceText}</p>
        ${inRecipe ? `<div class="mat-card-status in-recipe">✓ 已在配方 · ${fmt(item.unit?item.quantity:item.grams)} ${escape(item.unit||'g')}（點擊編輯）</div>` : ''}
      </article>`;
    }).join('') || '<p class="empty">沒有符合條件的原料。</p>';
  }
  function renderSaved() {
    const q = $('recipeSearch').value.toLowerCase(), type = $('recipeType').value;
    const groups = new Map();
    [...data.recipes].sort((a,b)=>b.version-a.version).forEach(r=>{ if(!groups.has(r.id)) groups.set(r.id,[]); groups.get(r.id).push(r); });
    const list = [...groups.values()].filter(versions=>Boolean(versions[0].archived)===Boolean($('showArchived')?.checked)).filter(versions=>versions.some(r=>r.name.toLowerCase().includes(q)) && (!type || versions[0].type===type)).sort((a,b)=>b[0].createdAt.localeCompare(a[0].createdAt));

  $('recover').onclick = async () => {try{
    const s=draftStorage.getItem(draftKey); if(!s) return notice('此帳號沒有本機草稿。');
    const restored=JSON.parse(s);if(!Array.isArray(restored.items)||!restored.cost||!AromaCore.TYPES.includes(restored.type)) throw Error('草稿格式不正確');
    if(dirty && !await confirmChange('要恢復本機草稿嗎？','恢復草稿「'+restored.name+'」','取代目前修改')) return;
    recipe=restored;dirty=true;pendingSave=null;renderRecipe();notice('已恢復本機草稿，尚未存入雲端。');
  }catch(e){fail(e);} };
  $('log').onclick = () => task(async()=>{
    if(!recipe.id || dirty) throw Error('請先儲存目前配方版本，再建立製作紀錄');
    const payload={recipeId:recipe.id,version:recipe.version,date:$('logDate').value,units:$('logUnits').value,notes:$('logNotes').value};
    const key=JSON.stringify(payload);if(!pendingLog || pendingLog.key!==key) pendingLog={key,payload:{...payload,requestId:uid()}};
    await rpc('saveLog',pendingLog.payload);pendingLog=null;await refresh();notice('製作紀錄與成本快照已保存。');
  });
  $('logDate').value=new Intl.DateTimeFormat('sv-SE',{timeZone:'Asia/Taipei',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date()); $('logUnits').value=1;
  window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue='';}});
  if ($('costPanel')) $('costPanel').open = window.innerWidth >= 768;
  if(window.innerWidth>=1100)$('materialPicker').open=true;
  if(window.innerWidth<768)$('workPanel').open=true;
  if(window.matchMedia){const desktop=window.matchMedia('(min-width:1100px)');desktop.addEventListener('change',()=>{if($('materialPicker').dataset.manage!=='true')$('materialPicker').open=desktop.matches;});}
  if ($('btnPrintRecipe')) {
    $('btnPrintRecipe').onclick = () => {
      if (!recipe?.items.length) { notice('請先加入原料才能列印配方工作單。'); return; }
      window.print();
    };
  }
  if ($('btnResetRecipe')) {
    $('btnResetRecipe').onclick = async () => {
      if (!recipe?.items.length) return;
      if (await confirmChange('要清空配方原料嗎？', '清空目前配方中已加入的所有原料', '清空原料')) {
        recipe.items = [];
        recipe.baseId = '';
        draft();
        renderRecipe();
        notice('已清空目前配方原料。可重新挑選或載入範本。');
      }
    };
  }
  switchManage('manageBasics');
  task(()=>refresh());
})();
</script>
